<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DCA Plan Activity — SteadyStake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/dashboard.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="SteadyStake plan activity">
        <img src="/logo.png" alt="" width="38" height="38" />
        <span>SteadyStake</span>
      </a>
      <nav class="main-nav" aria-label="Backend dashboard">
        <a class="nav-link active" href="/" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M4 19V9m6 10V5m6 14v-7m4 7H2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>Plan activity</span>
        </a>
        <a class="nav-link" href="/deployments.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M3 12h18M12 3c2.4 2.5 3.7 5.5 3.7 9S14.4 18.5 12 21M12 3C9.6 5.5 8.3 8.5 8.3 12s1.3 6.5 3.7 9" />
          </svg>
          <span>Deployments</span>
        </a>
      </nav>
      <span class="live-pill">Operations live</span>
    </div>
  </header>

  <main class="page-shell">
    <div class="page-heading">
      <div class="heading-copy">
        <p class="eyebrow">Portfolio engine</p>
        <h1>DCA plan activity</h1>
        <p class="page-description">Live contract state and historical plan progress across every registered wallet.</p>
      </div>
      <div class="page-actions">
        <span class="status" id="plans-status">Loading…</span>
        <button class="button refresh" id="refresh-plans" type="button">Refresh</button>
      </div>
    </div>

    <section class="content-panel" aria-label="DCA plans">
      <div class="execution-notice" id="execution-notice" hidden></div>
      <div class="log-panel" id="log-panel" hidden>
        <div class="log-head">
          <span class="dot" id="log-dot"></span>
          <span class="step" id="log-step">Starting…</span>
          <span class="elapsed" id="log-elapsed">0s</span>
          <button class="button toggle" id="log-toggle" type="button">Hide log</button>
        </div>
        <div class="log-body" id="log-body"></div>
      </div>
      <!-- Outside #plans: that container is re-rendered wholesale every few seconds, which would
           wipe the field's value and focus mid-keystroke. -->
      <div class="plans-toolbar">
        <div class="search-field">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="M20.5 20.5 17 17" stroke-linecap="round" />
          </svg>
          <input id="wallet-search" type="search" autocomplete="off" spellcheck="false"
            placeholder="Search by wallet address" aria-label="Search wallets by address" />
          <button class="search-clear" id="wallet-search-clear" type="button" aria-label="Clear wallet search" hidden>×</button>
        </div>
        <span class="search-count" id="wallet-search-count" role="status" hidden></span>
        <!-- Pausing a plan acts on someone else's automation, so it is the one thing here behind a
             token (ADMIN_API_TOKEN on the backend). Kept in localStorage so an operator enters it
             once per browser; it is a shared operator secret, not a per-user credential. -->
        <div class="admin-field">
          <svg class="admin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="4" y="10.5" width="16" height="10" rx="2" />
            <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5" stroke-linecap="round" />
          </svg>
          <input id="admin-token" type="password" autocomplete="off" spellcheck="false"
            placeholder="Admin token (to pause plans)" aria-label="Admin API token" />
        </div>
      </div>
      <div id="plans"><div class="empty">Loading plan activity…</div></div>
      <div class="empty search-empty" id="search-empty" hidden></div>
    </section>
  </main>

  <script src="/dashboard-shared.js"></script>
  <script>
    let explorerByChain = {};
    let lastPlansSignature = "";
    const NOT_RECORDED = '<i class="nr">Not recorded</i>';
    const STALL_AFTER_MS = 20000;

    function badges(plan) {
      const output = [];
      const status = plan.status || (plan.active ? "active" : "inactive");
      const hold = planHold(plan);
      output.push('<span class="badge ' + status + '">' + status + "</span>");
      if (plan.enrolled) output.push('<span class="badge enrolled">auto</span>');
      if (hold) {
        // The reason lives in the tooltip: it is the operator's own text and can be long.
        output.push(
          '<span class="badge held"' +
          (hold.reason ? ' title="' + escapeHtml(hold.reason) + '"' : "") +
          ">admin " + escapeHtml(hold.status) + "</span>",
        );
      }
      if (plan.executionMode === "auto" && !hold) {
        output.push('<span class="badge executing">auto executing</span>');
      }
      if (status === "active") {
        // A held plan may well be past its cooldown, but it is not going to run, so the ready
        // badge stays down — it would otherwise sit next to "admin paused" contradicting it.
        output.push(
          '<span class="badge ready live-ready"' +
          (plan.ready && plan.executionMode !== "auto" && !hold ? "" : " hidden") +
          ">ready</span>",
        );
      }
      return output.join("");
    }

    /** The admin hold on a plan, or null. Only meaningful while the plan can still run. */
    function planHold(plan) {
      const status = plan.status || (plan.active ? "active" : "inactive");
      if (status !== "active") return null;
      return plan.adminControl || null;
    }

    function formatCountdown(secondsTotal) {
      const total = Math.max(0, Math.floor(Number(secondsTotal) || 0));
      if (total <= 0) return "now";
      const days = Math.floor(total / 86400);
      const hours = Math.floor((total % 86400) / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const seconds = total % 60;
      const parts = [];
      if (days) parts.push(days + "d");
      if (hours) parts.push(hours + "h");
      if (minutes) parts.push(minutes + "m");
      if (seconds || parts.length === 0) parts.push(seconds + "s");
      return parts.join(" ");
    }

    function planTiming(member, plan) {
      if (plan.status !== "active" || !plan.dueTimestamp || !member.chainTime) return "";
      const offset = Number(member.chainTime) - Math.floor(Date.now() / 1000);
      const remaining = Number(plan.dueTimestamp) - (Math.floor(Date.now() / 1000) + offset);
      return '<div class="plan-timing">' +
        '<span>Next buy</span>' +
        '<b class="plan-countdown" data-target="' + plan.dueTimestamp +
          '" data-clock-offset="' + offset + '">' + formatCountdown(remaining) + "</b>" +
      "</div>";
    }

    function formatDate(iso) {
      if (!iso) return null;
      const date = new Date(iso);
      if (Number.isNaN(date.getTime())) return null;
      return date.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) +
        " " + date.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
    }

    function formatNumber(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return value;
      return number.toLocaleString(undefined, { maximumFractionDigits: 2 });
    }

    function usdc(value) {
      return value == null ? NOT_RECORDED : "<b>" + formatNumber(value) + " USDC</b>";
    }

    function progressBar(plan) {
      if (plan.progressPct == null) {
        return '<div class="progress unknown"><span style="width:0%"></span></div>' +
          '<div class="progress-label"><i class="nr">Progress not recorded</i></div>';
      }

      const percentage = Math.max(0, Math.min(100, Number(plan.progressPct)));
      const className = plan.status === "completed"
        ? " done"
        : plan.status === "cancelled"
          ? " cancelled"
          : "";

      return '<div class="progress' + className + '" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' +
        percentage + '"><span style="width:' + percentage + '%"></span></div>' +
        '<div class="progress-label">' + percentage + "% swapped</div>";
    }

    function detailGrid(plan) {
      const executionLabel = plan.totalExecutions == null
        ? plan.executedCount + " / ?"
        : plan.executedCount + " / " + plan.totalExecutions +
          (plan.executionsRemaining > 0 ? " · " + plan.executionsRemaining + " left" : "");

      return '<div class="plan-detail">' +
        '<div class="d"><span>Committed</span>' + usdc(plan.committed) + "</div>" +
        '<div class="d"><span>Swapped</span>' + usdc(plan.swapped) + "</div>" +
        '<div class="d"><span>Remaining</span>' + usdc(plan.remaining) + "</div>" +
        '<div class="d"><span>Executions</span><b>' + executionLabel + "</b></div>" +
      "</div>";
    }

    function datesLine(plan) {
      const parts = [];
      const started = formatDate(plan.createdAt);
      const last = formatDate(plan.lastExecutionAt);
      const ended = formatDate(plan.endedAt);

      parts.push("Started " + (started ? "<b>" + started + "</b>" : NOT_RECORDED));
      if (last && !ended) parts.push("Last swap <b>" + last + "</b>");
      if (plan.status !== "active") {
        const verb = plan.status === "cancelled" ? "Cancelled" : "Completed";
        parts.push(verb + " " + (ended ? "<b>" + ended + "</b>" : NOT_RECORDED));
      }
      return '<div class="plan-dates">' + parts.join("") + "</div>";
    }

    function planActions(member, plan) {
      if (plan.status !== "active" && !plan.active) return "";
      // Any execution holds the button, not just the scheduler's. A manual run — from here or from
      // the web app's wallet — used to leave it live, so a second click double-submitted the plan.
      const autoExecuting = plan.executionMode === "auto";
      const executing = plan.executionMode != null;
      const hold = planHold(plan);
      const ready = Boolean(
        plan.ready ||
        (plan.dueTimestamp && member.chainTime && plan.dueTimestamp <= member.chainTime)
      );
      const dataAttrs =
        ' data-chain-id="' + member.chainId + '"' +
        ' data-user="' + escapeHtml(member.user) + '"' +
        ' data-schedule-id="' + escapeHtml(plan.scheduleId) + '"';

      // The executor refuses a held plan outright, so the Execute button is disabled here rather
      // than left live to produce a confusing "paused by an admin" error on click.
      const title = hold
        ? "Resume this plan before executing it — an admin has " + hold.status + " it"
        : autoExecuting
          ? "The backend is executing this plan now"
          : executing
            ? "This plan is already executing"
            : ready
              ? "Execute this plan now using the backend relayer"
              : "This plan is still in cooldown";

      let output = '<div class="plan-actions">' +
        // `is-held` is what keeps the per-second countdown loop from re-enabling this button when
        // the cooldown elapses — readiness is irrelevant while a hold is in force.
        '<button class="button execute-plan' +
          (hold ? " is-held" : "") +
          (executing && !hold ? " auto-executing running" : "") +
          '" type="button"' + dataAttrs +
          ' title="' + escapeHtml(title) + '"' +
          (ready && !executing && !hold ? "" : " disabled") +
        '>' +
          (executing && !hold
            ? '<span class="execute-spinner"></span>'
            : '<span class="execute-icon">▶</span>') +
          '<span>' +
          (hold
            ? "On hold"
            : autoExecuting ? "Auto Executing..." : executing ? "Executing…" : ready ? "Execute now" : "Cooldown") +
        "</span></button>";

      if (hold) {
        output +=
          '<button class="button resume-plan" type="button"' + dataAttrs +
            ' title="Let the relayer auto-execute this plan again">' +
            '<span class="execute-icon">▶</span><span>Resume</span>' +
          "</button>";
        // Escalating a pause to a permanent stop stays available; the reverse is Resume.
        if (hold.status === "paused") {
          output +=
            '<button class="button hold-plan danger" type="button" data-hold-status="cancelled"' +
              dataAttrs + ' title="Stop automation for this plan for good (off-chain; funds are untouched)">' +
              '<span class="execute-icon">■</span><span>Stop auto-exec</span>' +
            "</button>";
        }
      } else {
        output +=
          '<button class="button hold-plan" type="button" data-hold-status="paused"' + dataAttrs +
            ' title="Pause auto-execution of this plan (off-chain; funds are untouched)">' +
            '<span class="execute-icon">❚❚</span><span>Pause</span>' +
          "</button>" +
          '<button class="button hold-plan danger" type="button" data-hold-status="cancelled"' + dataAttrs +
            ' title="Stop automation for this plan for good (off-chain; funds are untouched)">' +
            '<span class="execute-icon">■</span><span>Stop auto-exec</span>' +
          "</button>";
      }

      return output + "</div>";
    }

    function plansSignature(members) {
      return JSON.stringify((members || []).map(function (member) {
        return {
          chainId: member.chainId,
          chainName: member.chainName,
          user: member.user,
          plans: member.plans || [],
        };
      }));
    }

    function renderPlan(member, plan, explorer) {
      const status = plan.status || (plan.active ? "active" : "completed");
      return '<div class="plan" data-status="' + status + '"' +
        ' data-chain-id="' + member.chainId + '"' +
        ' data-user="' + escapeHtml(member.user) + '"' +
        ' data-schedule-id="' + escapeHtml(plan.scheduleId) + '">' +
        '<div class="plan-top">' +
          '<span class="pid">#' + plan.scheduleId + "</span>" +
          '<span class="freq">' + plan.frequencyLabel + "</span>" +
          badges(plan) +
          '<button class="refresh-plan" type="button"' +
            ' data-chain-id="' + member.chainId + '"' +
            ' data-user="' + escapeHtml(member.user) + '"' +
            ' data-schedule-id="' + escapeHtml(plan.scheduleId) + '"' +
            ' title="Refresh only this plan" aria-label="Refresh plan #' +
              escapeHtml(plan.scheduleId) + '">' +
            '<span aria-hidden>↻</span>' +
          "</button>" +
        "</div>" +
        '<div class="plan-body">' +
          '<span class="amount">' +
            (plan.amountPerInterval == null ? NOT_RECORDED : plan.amountPerInterval + " USDC") +
          "</span>" +
          '<span class="arrow">→</span>' +
          (plan.targetToken ? addressElement(plan.targetToken, explorer) : NOT_RECORDED) +
        "</div>" +
        planTiming(member, plan) +
        progressBar(plan) +
        detailGrid(plan) +
        datesLine(plan) +
        planActions(member, plan) +
      "</div>";
    }

    function renderMember(member, index) {
      const explorer = explorerByChain[member.chainId] || null;
      const activeCount = member.plans.filter(function (plan) {
        return plan.status === "active" || (plan.active && !plan.status);
      }).length;
      const completedCount = member.plans.filter(function (plan) { return plan.status === "completed"; }).length;
      const cancelledCount = member.plans.filter(function (plan) { return plan.status === "cancelled"; }).length;

      const plans = member.plans.map(function (plan) {
        return renderPlan(member, plan, explorer);
      }).join("");

      return '<article class="card member-card" style="--i:' + index + '" data-active="' + activeCount +
        '" data-completed="' + completedCount + '" data-cancelled="' + cancelledCount +
        '" data-user="' + escapeHtml(String(member.user || "").toLowerCase()) + '">' +
        '<div class="card-head">' +
          '<span class="network-title"><span class="network-icon">' +
            String(member.chainName || "N").slice(0, 1) +
          '</span><span class="net-name">' + member.chainName + "</span></span>" +
          '<span class="chip">' + activeCount + " active · " + member.plans.length + " total</span>" +
        "</div>" +
        '<div class="member-meta"><div class="row"><span class="label">Wallet</span>' +
          addressElement(member.user, explorer) +
        "</div></div>" +
        plans +
      "</article>";
    }

    function renderPlans(members) {
      if (!members.length) {
        return '<div class="empty">No registered wallets with DCA plans.</div>';
      }

      const allPlans = members.reduce(function (output, member) {
        return output.concat(member.plans || []);
      }, []);
      const active = allPlans.filter(function (plan) {
        return plan.status === "active" || (plan.active && !plan.status);
      }).length;
      const completed = allPlans.filter(function (plan) { return plan.status === "completed"; }).length;
      const cancelled = allPlans.filter(function (plan) { return plan.status === "cancelled"; }).length;

      return '<div class="plan-summary" aria-label="Plan totals">' +
          '<div class="summary-item"><b>' + allPlans.length + '</b><span>Total plans</span></div>' +
          '<div class="summary-item"><b>' + active + '</b><span>Active</span></div>' +
          '<div class="summary-item"><b>' + completed + '</b><span>Completed</span></div>' +
          '<div class="summary-item"><b>' + cancelled + '</b><span>Cancelled</span></div>' +
        "</div>" +
        '<div class="plan-filters" role="group" aria-label="Filter wallets">' +
          '<button class="filter-btn active" data-filter="all" type="button">All wallets</button>' +
          '<button class="filter-btn" data-filter="active" type="button">Active plans</button>' +
          '<button class="filter-btn" data-filter="completed" type="button">Completed plans</button>' +
          '<button class="filter-btn" data-filter="cancelled" type="button">Cancelled plans</button>' +
        "</div>" +
        '<div class="grid">' + members.map(renderMember).join("") + "</div>";
    }

    /* ---- Wallet search + status filter -------------------------------------
       Both hide member cards, so one pass owns visibility; if each wrote
       data-hidden on its own, whichever ran last would undo the other. Both
       live outside #plans so they survive its periodic re-render. */
    const walletSearchInput = document.getElementById("wallet-search");
    const walletSearchClear = document.getElementById("wallet-search-clear");
    const walletSearchCount = document.getElementById("wallet-search-count");
    const walletSearchEmpty = document.getElementById("search-empty");
    let activeFilter = "all";
    let walletQuery = "";

    function syncFilterButtons() {
      document.querySelectorAll(".filter-btn").forEach(function (button) {
        button.classList.toggle("active", button.dataset.filter === activeFilter);
      });
    }

    function applyCardVisibility() {
      const cards = document.querySelectorAll(".member-card");
      let matched = 0;
      cards.forEach(function (card) {
        const passesFilter =
          activeFilter === "all" || Number(card.dataset[activeFilter] || 0) > 0;
        const passesSearch =
          !walletQuery || (card.dataset.user || "").indexOf(walletQuery) !== -1;
        const visible = passesFilter && passesSearch;
        card.dataset.hidden = visible ? "false" : "true";
        if (visible) matched += 1;
      });

      const searching = walletQuery.length > 0;
      walletSearchCount.hidden = !searching || cards.length === 0;
      if (!walletSearchCount.hidden) {
        walletSearchCount.textContent =
          matched + " of " + cards.length + " wallet" + (cards.length === 1 ? "" : "s");
      }
      const noMatches = searching && cards.length > 0 && matched === 0;
      walletSearchEmpty.hidden = !noMatches;
      if (noMatches) {
        walletSearchEmpty.textContent =
          'No wallet matches "' + walletSearchInput.value.trim() + '".';
      }
    }

    function setWalletQuery(value) {
      // Addresses are rendered checksummed but pasted in any casing, so both sides are lowered.
      walletQuery = String(value || "").trim().toLowerCase();
      walletSearchClear.hidden = walletSearchInput.value.length === 0;
      applyCardVisibility();
    }

    function clearWalletSearch() {
      walletSearchInput.value = "";
      setWalletQuery("");
    }

    walletSearchInput.addEventListener("input", function () {
      setWalletQuery(walletSearchInput.value);
    });

    walletSearchInput.addEventListener("keydown", function (event) {
      if (event.key === "Escape") clearWalletSearch();
    });

    walletSearchClear.addEventListener("click", function () {
      clearWalletSearch();
      walletSearchInput.focus();
    });

    const logPanel = document.getElementById("log-panel");
    const logBody = document.getElementById("log-body");
    const logStep = document.getElementById("log-step");
    const logDot = document.getElementById("log-dot");
    const logElapsed = document.getElementById("log-elapsed");
    const logToggle = document.getElementById("log-toggle");
    const executionNotice = document.getElementById("execution-notice");
    let logTimer = null;
    let lastMessageAt = 0;
    let stallNoted = false;

    function formatElapsed(milliseconds) {
      const seconds = Math.floor(milliseconds / 1000);
      return seconds < 60 ? seconds + "s" : Math.floor(seconds / 60) + "m " + (seconds % 60) + "s";
    }

    function logLine(message, className) {
      const atBottom = logBody.scrollHeight - logBody.scrollTop - logBody.clientHeight < 40;
      const element = document.createElement("div");
      element.className = "log-line" + (className ? " " + className : "");
      element.innerHTML = '<span class="t">' + new Date().toLocaleTimeString() + "</span><span>" +
        escapeHtml(message) + "</span>";
      logBody.appendChild(element);
      if (atBottom) logBody.scrollTop = logBody.scrollHeight;
    }

    function startLog() {
      logPanel.hidden = false;
      logBody.innerHTML = "";
      logDot.className = "dot";
      logStep.textContent = "Starting…";
      stallNoted = false;
      const startedAt = Date.now();
      lastMessageAt = startedAt;
      window.clearInterval(logTimer);
      logTimer = window.setInterval(function () {
        logElapsed.textContent = formatElapsed(Date.now() - startedAt);
        const quietFor = Date.now() - lastMessageAt;
        if (quietFor > STALL_AFTER_MS) {
          logDot.classList.add("stalled");
          if (!stallNoted) {
            stallNoted = true;
            logLine("Still working — the current data source is responding slowly.", "warn");
          }
        } else {
          logDot.classList.remove("stalled");
        }
      }, 1000);
    }

    function stopLog(state) {
      window.clearInterval(logTimer);
      logTimer = null;
      logDot.className = "dot " + state;
    }

    function showExecutionNotice(message, state) {
      executionNotice.hidden = false;
      executionNotice.className = "execution-notice " + state;
      executionNotice.textContent = message;
    }

    logToggle.addEventListener("click", function () {
      const collapsed = logBody.classList.toggle("collapsed");
      logToggle.textContent = collapsed ? "Show log" : "Hide log";
    });

    async function loadExplorerUrls() {
      try {
        const response = await fetch("/api/config/networks");
        if (!response.ok) return;
        const data = await response.json();
        (data.networks || []).forEach(function (network) {
          explorerByChain[network.chainId] = network.explorerUrl || null;
        });
      } catch {
        explorerByChain = {};
      }
    }

    function loadPlans() {
      const status = document.getElementById("plans-status");
      const content = document.getElementById("plans");
      content.classList.remove("plans-stable");
      lastPlansSignature = "";
      status.textContent = "Loading…";
      content.innerHTML = '<div class="empty">Loading plan activity…</div>';
      startLog();

      const source = new EventSource("/api/plans/stream");
      let finished = false;

      source.addEventListener("log", function (event) {
        const data = JSON.parse(event.data);
        lastMessageAt = Date.now();
        stallNoted = false;
        logStep.textContent = data.message;
        const warning = /fail|error|empty|unusable|no /i.test(data.message);
        logLine(data.message, warning ? "warn" : null);
      });

      source.addEventListener("result", function (event) {
        finished = true;
        source.close();
        const data = JSON.parse(event.data).result || {};
        const members = data.members || [];
        lastPlansSignature = plansSignature(members);
        content.innerHTML = renderPlans(members);
        syncFilterButtons();
        applyCardVisibility();
        updatePlanCountdowns();
        window.requestAnimationFrame(function () {
          content.classList.add("plans-stable");
        });
        const summary = (data.planCount || 0) + " plan" + (data.planCount === 1 ? "" : "s") +
          " across " + members.length + " wallet" + (members.length === 1 ? "" : "s");
        status.textContent = summary + " · updated " + new Date().toLocaleTimeString();
        (data.errors || []).forEach(function (message) { logLine("warning: " + message, "warn"); });
        logLine("Done — " + summary + ".", "ok");
        logStep.textContent = "Done · " + summary;
        stopLog("done");
      });

      source.addEventListener("error", function (event) {
        if (!event.data) return;
        finished = true;
        source.close();
        const data = JSON.parse(event.data);
        content.innerHTML = '<div class="error">Failed to load plans: ' + escapeHtml(data.message) + "</div>";
        status.textContent = "Error";
        logLine("Failed: " + data.message, "warn");
        logStep.textContent = "Failed";
        stopLog("err");
      });

      source.onerror = function () {
        if (finished) return;
        if (source.readyState === EventSource.CONNECTING) {
          logLine("Connection interrupted — reconnecting.", "warn");
          logStep.textContent = "Reconnecting…";
          lastMessageAt = Date.now();
          return;
        }
        finished = true;
        source.close();
        content.innerHTML = '<div class="error">The plan stream disconnected.</div>';
        status.textContent = "Error";
        logStep.textContent = "Disconnected";
        stopLog("err");
      };
    }

    let backgroundRefreshRunning = false;
    function updatePlanCountdowns() {
      const browserNow = Math.floor(Date.now() / 1000);
      document.querySelectorAll(".plan-countdown").forEach(function (countdown) {
        const target = Number(countdown.dataset.target);
        const clockOffset = Number(countdown.dataset.clockOffset || 0);
        const remaining = target - (browserNow + clockOffset);
        const ready = remaining <= 0;
        countdown.textContent = formatCountdown(remaining);
        countdown.classList.toggle("now", ready);

        const plan = countdown.closest(".plan");
        if (!plan) return;
        const autoExecuting = Boolean(plan.querySelector(".auto-executing"));
        const held = Boolean(plan.querySelector(".execute-plan.is-held"));
        const readyBadge = plan.querySelector(".live-ready");
        if (readyBadge) readyBadge.hidden = !ready || autoExecuting || held;
        const executeButton = plan.querySelector(".execute-plan");
        if (
          executeButton &&
          !held &&
          !executeButton.classList.contains("running") &&
          !executeButton.classList.contains("auto-executing")
        ) {
          executeButton.disabled = !ready;
          executeButton.title = ready
            ? "Execute this plan now using the backend relayer"
            : "This plan is still in cooldown";
          const label = executeButton.querySelector("span:last-child");
          if (label) label.textContent = ready ? "Execute now" : "Cooldown";
        }
      });
    }

    async function refreshPlansSilently() {
      if (backgroundRefreshRunning) return;
      backgroundRefreshRunning = true;
      try {
        const response = await fetch("/api/plans", { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const data = await response.json();
        const members = data.members || [];
        const signature = plansSignature(members);
        const plansElement = document.getElementById("plans");
        if (signature !== lastPlansSignature) {
          lastPlansSignature = signature;
          plansElement.classList.add("plans-stable");
          plansElement.innerHTML = renderPlans(members);
          // Re-rendering rebuilds the cards and the filter pills, so a poll landing mid-search
          // would otherwise silently drop the operator's search and reset the filter.
          syncFilterButtons();
          applyCardVisibility();
        }
        updatePlanCountdowns();
        const summary = (data.planCount || 0) + " plan" + (data.planCount === 1 ? "" : "s") +
          " across " + members.length + " wallet" + (members.length === 1 ? "" : "s");
        document.getElementById("plans-status").textContent =
          summary + " · updated " + new Date().toLocaleTimeString();
      } catch {
        // Keep the last good snapshot visible; the next poll will retry.
      } finally {
        backgroundRefreshRunning = false;
      }
    }

    /* ---- Admin holds -------------------------------------------------------
       Pausing or stopping automation on someone else's plan is the only action here that needs the
       admin token, so it is kept per-browser in localStorage and sent as x-admin-token. Everything
       these endpoints do is off-chain: the schedule, its enrolment and the deposit are untouched,
       and the owner can still cancel their own plan and be refunded. */
    const ADMIN_TOKEN_STORAGE_KEY = "steadystake.adminToken";
    const adminTokenInput = document.getElementById("admin-token");

    try {
      adminTokenInput.value = window.localStorage.getItem(ADMIN_TOKEN_STORAGE_KEY) || "";
    } catch {
      // Private-mode browsers can refuse localStorage; the field still works for this session.
    }
    adminTokenInput.addEventListener("change", function () {
      try {
        const value = adminTokenInput.value.trim();
        if (value) window.localStorage.setItem(ADMIN_TOKEN_STORAGE_KEY, value);
        else window.localStorage.removeItem(ADMIN_TOKEN_STORAGE_KEY);
      } catch {
        // As above — not being able to remember it is not a reason to fail the action.
      }
    });

    /** status: 'paused' | 'cancelled' to place a hold, or null to lift one. */
    function applyPlanHold(button, status) {
      if (button.disabled) return;
      const token = adminTokenInput.value.trim();
      if (!token) {
        showExecutionNotice(
          "Enter the admin token to pause or resume a plan.",
          "error",
        );
        adminTokenInput.focus();
        return;
      }

      const chainId = Number(button.dataset.chainId);
      const userAddress = button.dataset.user;
      const scheduleId = button.dataset.scheduleId;
      const planLabel = "plan #" + scheduleId + " for " + shortenAddress(userAddress);

      let reason = null;
      if (status) {
        const verb = status === "paused" ? "Pause" : "Stop";
        // The reason is shown to the plan owner on their card, so it is prompted for rather than
        // left blank — "contact the admin" with no explanation is a bad thing to receive.
        reason = window.prompt(
          verb + " auto-execution of " + planLabel + " on chain " + chainId + ".\n\n" +
          "This is off-chain: the plan and the user's USDC are untouched, but the relayer will " +
          "stop executing it and the user is told to contact you.\n\n" +
          "Reason shown to the user (optional):",
          "",
        );
        // Cancelling the prompt means "never mind"; an empty string means "no reason given".
        if (reason === null) return;
      } else if (!window.confirm("Resume auto-execution of " + planLabel + "?")) {
        return;
      }

      const previousHtml = button.innerHTML;
      button.disabled = true;
      button.innerHTML = '<span class="execute-spinner"></span><span>Saving…</span>';
      showExecutionNotice(
        (status ? "Placing a hold on " : "Resuming ") + planLabel + "…",
        "running",
      );

      const endpoint = status ? "/api/admin/plans/control" : "/api/admin/plans/resume";
      const body = { chainId: chainId, userAddress: userAddress, scheduleId: scheduleId };
      if (status) {
        body.status = status;
        body.reason = reason;
      }

      fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-admin-token": token },
        body: JSON.stringify(body),
      })
        .then(async function (response) {
          const data = await response.json().catch(function () { return {}; });
          if (!response.ok) {
            throw new Error(data.error || "Request failed (HTTP " + response.status + ")");
          }
          showExecutionNotice(
            status
              ? "Auto-execution " + status + " for " + planLabel + "."
              : data.message || "Resumed " + planLabel + ".",
            "success",
          );
          // Force the next poll to re-render: the hold changes the card, but the plan snapshot
          // itself may be byte-identical and would otherwise be skipped as unchanged.
          lastPlansSignature = "";
          window.setTimeout(refreshPlansSilently, 400);
        })
        .catch(function (error) {
          showExecutionNotice("Could not update the plan: " + error.message, "error");
          button.disabled = false;
          button.innerHTML = previousHtml;
        });
    }

    document.getElementById("refresh-plans").addEventListener("click", loadPlans);
    window.setInterval(updatePlanCountdowns, 1000);
    window.setInterval(refreshPlansSilently, 5000);
    document.addEventListener("click", function (event) {
      const refreshButton = event.target.closest(".refresh-plan");
      if (refreshButton) {
        if (refreshButton.disabled) return;
        const chainId = Number(refreshButton.dataset.chainId);
        const userAddress = refreshButton.dataset.user;
        const scheduleId = refreshButton.dataset.scheduleId;
        const currentPlan = refreshButton.closest(".plan");
        const previousHtml = refreshButton.innerHTML;
        refreshButton.disabled = true;
        refreshButton.classList.add("running");
        refreshButton.innerHTML = '<span class="execute-spinner"></span>';

        fetch("/api/plans?chainIds=" + encodeURIComponent(chainId), {
          cache: "no-store",
        })
          .then(async function (response) {
            if (!response.ok) throw new Error("HTTP " + response.status);
            const data = await response.json();
            const members = data.members || [];
            const member = members.find(function (item) {
              return item.chainId === chainId &&
                String(item.user).toLowerCase() === String(userAddress).toLowerCase();
            });
            const plan = member?.plans?.find(function (item) {
              return String(item.scheduleId) === String(scheduleId);
            });
            if (!member || !plan) {
              throw new Error("Plan is no longer available.");
            }

            const holder = document.createElement("div");
            holder.innerHTML = renderPlan(
              member,
              plan,
              explorerByChain[chainId] || null,
            );
            const refreshedPlan = holder.firstElementChild;
            if (!refreshedPlan || !currentPlan) {
              throw new Error("Could not update the plan card.");
            }
            currentPlan.replaceWith(refreshedPlan);
            updatePlanCountdowns();
            document.getElementById("plans-status").textContent =
              "Plan #" + scheduleId + " refreshed · " + new Date().toLocaleTimeString();
          })
          .catch(function (error) {
            refreshButton.disabled = false;
            refreshButton.classList.remove("running");
            refreshButton.innerHTML = previousHtml;
            showExecutionNotice(
              "Plan #" + scheduleId + " refresh failed: " + error.message,
              "error",
            );
          });
        return;
      }

      const executeButton = event.target.closest(".execute-plan");
      if (executeButton) {
        if (executeButton.disabled) return;
        const chainId = Number(executeButton.dataset.chainId);
        const userAddress = executeButton.dataset.user;
        const scheduleId = executeButton.dataset.scheduleId;
        const confirmed = window.confirm(
          "Execute DCA plan #" + scheduleId + " for " + shortenAddress(userAddress) +
          " on chain " + chainId + " using the backend relayer?",
        );
        if (!confirmed) return;

        const previousHtml = executeButton.innerHTML;
        executeButton.disabled = true;
        executeButton.classList.add("running");
        executeButton.innerHTML = '<span class="execute-spinner"></span><span>Executing…</span>';
        showExecutionNotice(
          "Executing plan #" + scheduleId + " for " + shortenAddress(userAddress) + "…",
          "running",
        );

        fetch("/api/execute-plan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chainId: chainId,
            userAddress: userAddress,
            scheduleId: scheduleId,
          }),
        })
          .then(async function (response) {
            const data = await response.json().catch(function () { return {}; });
            if (!response.ok) {
              throw new Error(data.error || "Execution request failed (HTTP " + response.status + ")");
            }
            if (!data.executed) {
              const reason = Array.isArray(data.errors) && data.errors.length
                ? data.errors.join(" · ")
                : "The plan was not executed.";
              throw new Error(reason);
            }
            showExecutionNotice(
              "Plan #" + scheduleId + " executed successfully. Refreshing live state…",
              "success",
            );
            window.setTimeout(loadPlans, 900);
          })
          .catch(function (error) {
            showExecutionNotice("Execution failed: " + error.message, "error");
            executeButton.disabled = false;
            executeButton.classList.remove("running");
            executeButton.innerHTML = previousHtml;
          });
        return;
      }

      const holdButton = event.target.closest(".hold-plan");
      if (holdButton) {
        applyPlanHold(holdButton, holdButton.dataset.holdStatus);
        return;
      }

      const resumeButton = event.target.closest(".resume-plan");
      if (resumeButton) {
        applyPlanHold(resumeButton, null);
        return;
      }

      const filterButton = event.target.closest(".filter-btn");
      if (!filterButton) return;
      activeFilter = filterButton.dataset.filter;
      syncFilterButtons();
      applyCardVisibility();
    });

    loadExplorerUrls().finally(loadPlans);
  </script>
</body>
</html>
